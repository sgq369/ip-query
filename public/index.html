  // ---- 泄露检测 + 出口检测（纯浏览器端；针对你当前的上网环境，与上方查询的 IP 无关）----
  function parseCandidate(line){
    var m=line.match(/candidate:\S+ \d+ \S+ \d+ (\S+) \d+ typ (\w+)/);
    return m?{ip:m[1],type:m[2]}:null;
  }
  function isPrivateIP(ip){
    return /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.|169\.254\.)/.test(ip)||ip.indexOf('fe80')===0||ip.indexOf('::1')===0||ip.indexOf('fd')===0||ip.indexOf('fc')===0;
  }
  function gatherWebRTC(ms){
    return new Promise(function(resolve){
      var ips=[],done=false,pc;
      function finish(){if(!done){done=true;try{pc.close();}catch(e){}resolve(ips);}}
      try{pc=new (window.RTCPeerConnection||window.webkitRTCPeerConnection)({iceServers:[{urls:'stun:stun.cloudflare.com:19302'},{urls:'stun:stun.l.google.com:19302'}]});}
      catch(e){resolve(null);return;}
      pc.onicecandidate=function(e){
        if(!e.candidate)return;
        var c=parseCandidate(e.candidate.candidate||'');
        if(c&&c.ip.indexOf('.local')<0&&ips.every(function(x){return x.ip!==c.ip;}))ips.push(c);
      };
      try{pc.createDataChannel('t');}catch(e){}
      pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).catch(function(){finish();});
      setTimeout(finish,ms||6000);
      pc.onicegatheringstatechange=function(){if(pc.iceGatheringState==='complete')finish();};
    });
  }
  async function runLeak(){

    if(rtc===null){
      rtcHtml='<tr><td>'+esc(t('leakWebrtc'))+'</td><td>'+esc(t('leakNoSupport'))+'</td></tr>';
    }else{
      var pub=rtc.filter(function(c){return !isPrivateIP(c.ip);});
      var leaked=pub.filter(function(c){return c.ip!==meIp;});
      if(leaked.length){purityState.webrtc=true;rtcHtml='<tr><td>'+esc(t('leakWebrtc'))+'</td><td><span class="warn">'+esc(t('leakFound'))+'</span>：'+esc(tf('leakFoundDetail',{ips:leaked.map(function(c){return c.ip+' ('+c.type+')';}).join('、')}))+'</td></tr>';}
      else if(pub.length){purityState.webrtc=false;rtcHtml='<tr><td>'+esc(t('leakWebrtc'))+'</td><td><span class="ok">'+esc(t('leakOkIp'))+'</span>：'+esc(tf('leakOkIpDetail',{ip:pub[0].ip}))+'</td></tr>';}
      else{purityState.webrtc=false;rtcHtml='<tr><td>'+esc(t('leakWebrtc'))+'</td><td><span class="ok">'+esc(t('leakOkNone'))+'</span>：'+esc(t('leakOkNoneDetail'))+'</td></tr>';}
      if(rtc.length)rtcHtml+='<tr><td>'+esc(t('leakCandidates'))+'</td><td class="mono">'+rtc.map(function(c){return esc(c.ip)+' · '+esc(c.type);}).join('<br>')+'</td></tr>';
    }
    var dnsHtml;
    try{
      var dr=await fetch('https://edns.ip-api.com/dns',{signal:AbortSignal.timeout(8000)});
      var text=await dr.text();
      var m=text.match(/dns:\s*([\d.:a-fA-F]+)\s*\(([^)]*)\)/);

        purityState.dns=(m[1]!==meIp);
        dnsHtml='<tr><td>'+esc(t('leakResolver'))+'</td><td class="mono">'+esc(m[1])+'（'+esc(m[2])+'）</td></tr>'
          +'<tr><td>'+esc(t('leakVerdict'))+'</td><td>'+esc(m[1]===meIp?t('leakDnsSame'):t('leakDnsDiff'))+'</td></tr>';
      }else dnsHtml='<tr><td>'+esc(t('leakDns'))+'</td><td>'+esc(t('leakDnsNoResult'))+'</td></tr>';
    }catch(e){dnsHtml='<tr><td>'+esc(t('leakDns'))+'</td><td>'+esc(t('leakDnsFail'))+'</td></tr>';}
    renderPurity();
    box.innerHTML='<div class="card"><h2 style="margin-top:0">'+esc(t('leakTitle'))+'</h2>'
      +'<p class="muted">'+esc(t('leakNote'))+'</p><table>'
      +rtcHtml+dnsHtml+'</table>'
      +'<p style="margin-top:10px"><button class="copy" type="button" id="leakRetry">'+esc(t('leakRetry'))+'</button></p></div>';

  // ---- V2：RDAP 注册信息 ----
  // Worker 端 rdap.org 跳 ARIN 常对共享出口限流（时好时坏），失败时改从浏览器直连
  // rdap.org（它和 ARIN 都回 Access-Control-Allow-Origin: *，访客自己的 IP 不易被限）
  function rdapVcard(vcard, field){
    if(!Array.isArray(vcard))return '';
    var props=vcard[1]||[];
    for(var i=0;i<props.length;i++){if(props[i][0]===field)return props[i][3]||'';}
    return '';
  }
  function normalizeRdapClient(query, type, d){
    var entities=(d.entities||[]).map(function(e){
      var em=String(rdapVcard(e.vCardArray,'email')||'').replace(/^mailto:/,'');
      return {roles:e.roles||[],name:rdapVcard(e.vCardArray,'fn'),email:em,handle:e.handle||''};
    });
    var events=(d.events||[]).map(function(e){return {action:e.eventAction||'',date:e.eventDate||''};});
    var reg=null,chg=null;
    events.forEach(function(e){if(e.action==='registration')reg=e;if(e.action==='last changed')chg=e;});
    var abuse=null,registrant=null;
    entities.forEach(function(e){if((e.roles||[]).indexOf('abuse')>=0)abuse=e;if((e.roles||[]).indexOf('registrant')>=0)registrant=e;});
    var cidrs=(d.cidr0_cidrs||[]).map(function(c){return c.v4prefix?c.v4prefix+'/'+c.length:(c.v6prefix?c.v6prefix+'/'+c.length:'');}).filter(Boolean);
    return {query:query,type:type,source:'rdap.org',objectClassName:d.objectClassName||'',handle:d.handle||'',
      name:d.name||(registrant&&registrant.name)||'',startAddress:d.startAddress||'',endAddress:d.endAddress||'',
      ipVersion:d.ipVersion||'',status:d.status||[],registration:reg?reg.date:'',lastChanged:chg?chg.date:'',
      entities:entities,abuseEmail:abuse?abuse.email:'',cidrs:cidrs,port43:d.port43||'',
      remarks:(d.remarks||[]).reduce(function(a,r){return a.concat(r.description||[]);},[])};
  }
  function renderRdap(d){
    var box=document.getElementById('rdap');
    var ent=(d.entities||[]).map(function(e){
      return esc((e.roles||[]).join('/'))+': '+esc(e.name||e.handle||'—')+(e.email?' &lt;'+esc(e.email)+'&gt;':'');
    }).join('<br>');
    box.innerHTML='<div class="card"><h2 style="margin-top:0">'+esc(t('rdapTitle'))+'</h2><table>'
      +'<tr><td>'+esc(t('rdapType'))+'</td><td>'+esc(d.type)+' · '+esc(d.objectClassName||'—')+'</td></tr>'
      +'<tr><td>'+esc(t('rdapHandle'))+'</td><td>'+esc(d.handle||'—')+'</td></tr>'
      +(d.name?'<tr><td>'+esc(t('rdapName'))+'</td><td>'+esc(d.name)+'</td></tr>':'')
      +(d.startAddress?'<tr><td>'+esc(t('rdapRange'))+'</td><td class="mono">'+esc(d.startAddress)+' – '+esc(d.endAddress)+'</td></tr>':'')
      +(d.cidrs&&d.cidrs.length?'<tr><td>'+esc(t('rdapCidr'))+'</td><td class="mono">'+d.cidrs.map(esc).join('<br>')+'</td></tr>':'')
      +'<tr><td>'+esc(t('rdapStatus'))+'</td><td>'+esc((d.status||[]).join(', ')||'—')+'</td></tr>'
      +'<tr><td>'+esc(t('rdapReg'))+'</td><td>'+esc(d.registration||'—')+'</td></tr>'
      +'<tr><td>'+esc(t('rdapChanged'))+'</td><td>'+esc(d.lastChanged||'—')+'</td></tr>'
      +(d.abuseEmail?'<tr><td>'+esc(t('rdapAbuse'))+'</td><td>'+esc(d.abuseEmail)+'</td></tr>':'')
      +(ent?'<tr><td>'+esc(t('rdapEntities'))+'</td><td>'+ent+'</td></tr>':'')
      +'<tr><td>'+esc(t('source'))+'</td><td>'+esc(t('rdapSource'))+'</td></tr>'
      +'</table></div>';
  }
  async function loadRdapDirect(query){
    var asMatch=query.match(/^AS?(\d+)$/i);
    var rdapUrl, type;
    if(isIP(query)){rdapUrl='https://rdap.org/ip/'+encodeURIComponent(query);type='ip';}
    else if(asMatch){rdapUrl='https://rdap.org/autnum/'+asMatch[1];type='autnum';}
    else if(/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(query)){rdapUrl='https://rdap.org/domain/'+encodeURIComponent(query);type='domain';}
    else return false;
    var r=await fetch(rdapUrl);
    if(!r.ok)return false;
    var d=await r.json();
    if(!d.objectClassName)return false;
    renderRdap(normalizeRdapClient(query,type,d));
    return true;
  }
  async function loadRdap(query){
    var box=document.getElementById('rdap');
    try{
      var r=await fetch('/api/rdap?query='+encodeURIComponent(query));
      if(r.ok){
        var d=await r.json();
        if(!d.error){renderRdap(d);return;}
      }
      // Worker 端失败：改从浏览器直连 rdap.org
      if(await loadRdapDirect(query))return;
      throw new Error('rdap');
    }catch(e){
      try{if(await loadRdapDirect(query))return;}catch(e2){}
      box.innerHTML='<div class="card"><h2 style="margin-top:0">'+esc(t('rdapTitle'))+'</h2><p class="muted">'+esc(t('rdapUnavailable'))+'</p></div>';
    }
  }

  // ---- V2：多源 DNS 对照 ----
  async function loadDnsMulti(opts){
    var box=document.getElementById('dnsmulti');
    try{
      var url=opts.domain?('/api/dns-multi?domain='+encodeURIComponent(opts.domain)):('/api/dns-multi?ip='+encodeURIComponent(opts.ip));
      var r=await fetch(url);
      if(!r.ok)return;
      var d=await r.json();
      var resolvers=d.resolvers||[];
      if(!resolvers.length)return;
      var html='<div class="card"><h2 style="margin-top:0">'+esc(t('dnsTitle'))+'</h2>';
      if(opts.domain){
        var allA=[].concat.apply([],resolvers.map(function(x){return x.a||[];}));
        var allAAAA=[].concat.apply([],resolvers.map(function(x){return x.aaaa||[];}));
        var agreeA=new Set(allA).size<=1, agreeAAAA=new Set(allAAAA).size<=1;
        html+='<p class="muted">'+esc(tf('dnsDomainNote',{d:opts.domain}))+'</p><div class="src-wrap"><table>'
          +'<tr><th>'+esc(t('dnsResolver'))+'</th><th>'+esc(t('dnsA'))+(agreeA?'':' <span class="warn">'+esc(t('dnsMismatch'))+'</span>')+'</th><th>'+esc(t('dnsAaaa'))+(agreeAAAA?'':' <span class="warn">'+esc(t('dnsMismatch'))+'</span>')+'</th></tr>'
          +resolvers.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="mono">'+(x.a&&x.a.length?x.a.map(esc).join('<br>'):'—')+'</td><td class="mono">'+(x.aaaa&&x.aaaa.length?x.aaaa.map(esc).join('<br>'):'—')+'</td></tr>';}).join('')
          +'</table></div>';
      }else{
        html+='<p class="muted">'+esc(tf('dnsPtrNote',{d:opts.ip}))+'</p><div class="src-wrap"><table>'
          +'<tr><th>'+esc(t('dnsResolver'))+'</th><th>'+esc(t('dnsHostname'))+'</th></tr>'
          +resolvers.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="mono">'+(x.ptr&&x.ptr.length?x.ptr.map(esc).join('<br>'):'—')+'</td></tr>';}).join('')
          +'</table></div>';
      }
      box.innerHTML=html+'</div>';
    }catch(e){}
  }

  // ---- V2：IP 计算器（纯本地） ----
  function ipToInt(s){var p=s.split('.').map(Number);return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];}
  function intToIp(n){return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');}
  function expandIPv6(s){
    var parts=s.split('::');
    var h=parts[0]?parts[0].split(':'):[], t=parts.length>1&&parts[1]?parts[1].split(':'):[];
    var miss=8-h.length-t.length;
    var full=h.concat(Array(miss<0?0:miss).fill('0'),t);
    return full.map(function(g){return g.padStart(4,'0');}).join(':');
  }
  function calcIP(input){
    input=(input||'').trim();
    var m=input.match(/^([0-9a-fA-F:.]+)(?:\/(\d+))?$/);
    if(!m)throw new Error(t('calcBadFormat'));
    var addr=m[1], prefix=m[2]!=null?parseInt(m[2],10):null;
    if(addr.indexOf(':')>=0){
      if(prefix==null)prefix=128;
      if(prefix<0||prefix>128)throw new Error(t('calcBadV6Prefix'));
      var full=expandIPv6(addr);
      var groups=full.split(':').map(function(g){return parseInt(g,16);});
      var bits=prefix, net=groups.map(function(g,i){
        var take=Math.max(0,Math.min(16,bits-i*16));
        return take===0?0:(g&((0xFFFF<<(16-take))&0xFFFF));
      });
      var netStr=net.map(function(g){return g.toString(16);}).join(':');
      var total=prefix===128?'1':'2^'+(128-prefix);
      return {v6:true,rows:[[t('calcFull'),full],[tf('calcNetAddr',{p:prefix}),netStr+'/'+prefix],[t('calcPrefix'),String(prefix)],[t('calcTotalAddr'),total],[t('calcInt'),t('calcIntV6')]]};
    }
    if(!IP4.test(addr))throw new Error(tf('calcBadV4',{ip:addr}));
    if(prefix==null)prefix=32;
    if(prefix<0||prefix>32)throw new Error(t('calcBadV4Prefix'));
    var ip=ipToInt(addr);
    var mask=prefix===0?0:((0xFFFFFFFF<<(32-prefix))>>>0);
    var net=(ip&mask)>>>0, bc=(net|(~mask>>>0))>>>0;
    var total=Math.pow(2,32-prefix);
    var usable=prefix>=31?total:total-2;
    var first=prefix>=31?net:net+1, last=prefix>=31?bc:bc-1;
    return {v6:false,rows:[
      [t('calcIp'),addr],[t('calcMask'),intToIp(mask)],[t('calcWildcard'),intToIp(~mask>>>0)],
      [t('calcNetwork'),intToIp(net)],[t('calcBroadcast'),intToIp(bc)],
      [t('calcUsable'),String(usable)+tf('calcTotal',{n:total})],
      [t('calcRange'),prefix>=31?intToIp(first)+' – '+intToIp(last):intToIp(first)+' – '+intToIp(last)],
      [t('calcInt'),String(ip>>>0)],[t('calcHex'),'0x'+(ip>>>0).toString(16).toUpperCase().padStart(8,'0')],
      [t('calcCidr'),intToIp(net)+'/'+prefix]
    ]};
  }
  function runCalc(q){
    var box=document.getElementById('calcResult');
    try{
      var r=calcIP(q);
      box.innerHTML='<table>'+r.rows.map(function(row){return '<tr><td>'+row[0]+'</td><td class="mono">'+esc(row[1])+'</td></tr>';}).join('')+'</table>';
    }catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p>';}
  }
  document.getElementById('calcForm').addEventListener('submit',function(e){e.preventDefault();runCalc(document.getElementById('calcInput').value);});
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-calc]');if(b){document.getElementById('calcInput').value=b.getAttribute('data-calc');runCalc(b.getAttribute('data-calc'));}});

  async function lookupDirect(ip){
    var r=await fetch('https://ip-api.com/json/'+encodeURIComponent(ip)+'?fields=status,message,country,countryCode,regionName,city,zip,lat,lon,timezone,isp,org,as,asname,mobile,proxy,hosting,query');
    var d=await r.json();
    if(d.status!=='success')throw new Error(t('errLookup'));
    return {source:'ip-api.com',ip:d.query,country:d.country,countryCode:d.countryCode,region:d.regionName,city:d.city,zip:d.zip,lat:d.lat,lon:d.lon,timezone:d.timezone,isp:d.isp,org:d.org,as:d.as,asname:d.asname,mobile:d.mobile,proxy:d.proxy,hosting:d.hosting};
  }
  async function lookup(ip){
    try{
      var r=await fetch('/api/lookup?ip='+encodeURIComponent(ip));
      if(r.ok){
        var d=await r.json();
        // Worker 端 ip-api 常被上游限流、回退到 ipinfo 时缺 ISP/机房标识，
        // 此时再从浏览器直连 ip-api 补一份完整数据，拿到就用完整的。
        if(d.source==='ipinfo.io'){
          try{return await lookupDirect(ip);}catch(e){return d;}
        }
        return d;
      }
      throw new Error('worker');
    }catch(e){ return await lookupDirect(ip); }
  }
  async function go(q){
    q=(q||'').trim();
    if(!q){return goMe();}
    input.value=q;
    showLoading();
    history.replaceState(null,'','/ip/'+encodeURIComponent(q)+(lang==='en'?'?lang=en':''));
    try{
      if(isASN(q)){
        var ra=await fetch('/api/asn?as='+encodeURIComponent(q));
        var da=await ra.json();
        if(da.error)throw new Error(t('errAsn'));
        renderASN(da,q);return;
      }
      var ip=q, label='', wasDomain=false;
      if(!isIP(q)){
        var rr=await fetch('/api/resolve?domain='+encodeURIComponent(q));
        var dr=await rr.json();
        if(!dr.ips||!dr.ips.length)throw new Error(tf('errDomain',{q:q}));
        ip=dr.ips[0]; label=tf('domainTo',{q:q,ip:ip,more:dr.ips.length>1?tf('moreCount',{n:dr.ips.length}):''});
        wasDomain=true;
      }
      var d=await lookup(ip);
      try{var rh=await fetch('/api/rdns?ip='+encodeURIComponent(ip));var dh=await rh.json();if(dh.hostname)d.hostname=dh.hostname;}catch(e){}
      render(d,label,false);
      loadRdap(ip);
      if(wasDomain)loadDnsMulti({domain:q}); else loadDnsMulti({ip:ip});
      runLeakOutbound();
    }catch(e){showError(e.message||t('errLookup'));}
  }
  async function goMe(){
    showLoading();
    history.replaceState(null,'','/'+(lang==='en'?'?lang=en':''));
    try{
      var r=await fetch('/api/me');
      var d=await r.json();
      if(!d.ip)throw new Error(t('errNoIp'));
      render(d,t('yourIp'),true);
      loadRdap(d.ip); loadDnsMulti({ip:d.ip}); runLeakOutbound();
    }catch(e){showError(t('errNoIpRetry'));}
  }
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();go(input.value);});
  applyLang();
  detectLangFromIP();
  var m=location.pathname.match(/^\/ip\/(.+)$/);
  var initial=m?decodeURIComponent(m[1]):(new URLSearchParams(location.search).get('q')||'');
  if(initial)go(initial);else goMe();
})();
</script>
